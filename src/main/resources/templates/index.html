<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 25px; background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4 text-primary text-center">HỆ THỐNG QUẢN LÝ SINH VIÊN</h2>

    //thêm mới sinh viên
    <div class="card mb-4">
        <div class="card-header bg-primary text-white" id="formTitle">Thêm Sinh Viên Mới</div>
        <div class="card-body">
            <form id="studentForm" class="row g-3">
                <input type="hidden" id="studentId">
                <div class="col-md-2">
                    <input type="text" class="form-control" id="studentCode" placeholder="Mã SV" required>
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" id="fullName" placeholder="Họ và Tên" required>
                </div>
                <div class="col-md-3">
                    <input type="email" class="form-control" id="email" placeholder="Email" required>
                </div>
                <div class="col-md-2">
                    <input type="text" class="form-control" id="phone" placeholder="Số điện thoại">
                </div>
                <div class="col-md-2">
                    <input type="text" class="form-control" id="className" placeholder="Lớp">
                </div>
                <div class="col-12 text-end">
                    <button type="button" class="btn btn-secondary me-2" onclick="resetForm()">Hủy</button>
                    <button type="button" class="btn btn-success" id="btnSave" onclick="saveStudent()">Lưu Sinh Viên</button>
                </div>
            </form>
        </div>
    </div>

    // Thanh tìm kiếm sinh viên
    <div class="row mb-3">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control" placeholder="Nhập tên sinh viên cần tìm...">
                <button class="btn btn-outline-secondary" onclick="searchStudents()">Tìm kiếm</button>
            </div>
        </div>
    </div>

    // Bảng danh sách sinh viên
    <div class="card">
        <div class="card-body">
            <table class="table table-hover table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Mã SV</th>
                        <th>Họ Tên</th>
                        <th>Email</th>
                        <th>Số ĐT</th>
                        <th>Lớp</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "/api/students";

    // Khởi chạy khi tải trang
    document.addEventListener("DOMContentLoaded", loadStudents);

    function loadStudents() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => renderTable(data));
    }

    // Hiển thị dữ liệu lên bảng
    function renderTable(students) {
        const tbody = document.getElementById("studentTableBody");
        tbody.innerHTML = "";
        students.forEach(s => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${s.studentCode}</strong></td>
                    <td>${s.fullName}</td>
                    <td>${s.email}</td>
                    <td>${s.phone || ''}</td>
                    <td>${s.className || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" onclick="editStudent('${s.id}')">Sửa</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteStudent('${s.id}')">Xóa</button>
                    </td>
                </tr>
            `;
        });
    }

    //Tìm kiếm
    function searchStudents() {
        const keyword = document.getElementById("searchInput").value;
        fetch(`${API_URL}/search?keyword=${encodeURIComponent(keyword)}`)
            .then(res => res.json())
            .then(data => renderTable(data));
    }

    //Thêm mới hoặc Cập nhật
    function saveStudent() {
        const id = document.getElementById("studentId").value;
        const student = {
            studentCode: document.getElementById("studentCode").value,
            fullName: document.getElementById("fullName").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            className: document.getElementById("className").value
        };

        const url = id ? `${API_URL}/update/${id}` : API_URL; 

        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(student)
        }).then(res => {
            if (res.ok) {
                alert(id ? "Cập nhật thành công!" : "Thêm mới thành công!");
                resetForm();
                loadStudents();
            } else {
                alert("Lỗi! Vui lòng kiểm tra lại.");
            }
        });
    }

    // Đổ dữ liệu lên form để chuẩn bị cập nhật
    function editStudent(id) {
        fetch(`${API_URL}/${id}`)
            .then(res => res.json())
            .then(s => {
                document.getElementById("studentId").value = s.id;
                document.getElementById("studentCode").value = s.studentCode;
                document.getElementById("fullName").value = s.fullName;
                document.getElementById("email").value = s.email;
                document.getElementById("phone").value = s.phone;
                document.getElementById("className").value = s.className;
                
                document.getElementById("formTitle").innerText = "Cập Nhật Sinh Viên";
                document.getElementById("btnSave").innerText = "Lưu Thay Đổi";
                document.getElementById("btnSave").classList.replace("btn-success", "btn-warning");
            });
    }

    //Xóa sinh viên
    function deleteStudent(id) {
        if (confirm("Bạn có chắc chắn muốn xóa sinh viên này?")) {
            fetch(`${API_URL}/delete/${id}`, { method: "POST" })
                .then(res => {
                    if (res.ok) {
                        alert("Đã xóa sinh viên!");
                        loadStudents();
                    }
                });
        }
    }

    function resetForm() {
        document.getElementById("studentForm").reset();
        document.getElementById("studentId").value = "";
        document.getElementById("formTitle").innerText = "Thêm Sinh Viên Mới";
        document.getElementById("btnSave").innerText = "Lưu Sinh Viên";
        document.getElementById("btnSave").classList.replace("btn-warning", "btn-success");
    }
</script>
</body>
</html>
