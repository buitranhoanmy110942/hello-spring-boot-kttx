<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/adminlte/css/adminlte.css" />
</head>
<body>
    <div class="container-fluid p-4">
        <h2 class="mb-4">Quản lý Sinh viên</h2>

        <!-- Form Thêm / Cập nhật sinh viên -->
        <div class="card mb-4">
            <div class="card-header">
                <h3 class="card-title" id="formTitle">Thêm Sinh viên Mới</h3>
            </div>
            <div class="card-body">
                <form id="studentForm" class="row g-3">
                    <!-- Input ẩn lưu ID khi cập nhật -->
                    <input type="hidden" id="studentId">

                    <div class="col-md-2">
                        <label for="studentCode" class="form-label">Mã SV</label>
                        <input type="text" class="form-control" id="studentCode" placeholder="VD: SV011" required>
                    </div>
                    <div class="col-md-3">
                        <label for="fullName" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="fullName" required>
                    </div>
                    <div class="col-md-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="col-md-2">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input type="text" class="form-control" id="phone">
                    </div>
                    <div class="col-md-2">
                        <label for="className" class="form-label">Lớp</label>
                        <input type="text" class="form-control" id="className" placeholder="VD: C2024A">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Thêm Sinh viên</button>
                        <button type="button" class="btn btn-secondary d-none" id="cancelBtn" onclick="resetForm()">Hủy cập nhật</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Thanh tìm kiếm (Yêu cầu 3 & 10) -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" id="searchInput" class="form-control" placeholder="Nhập từ khóa tìm kiếm (Tên, Mã SV, Email, SĐT)...">
                            <button class="btn btn-primary" type="button" onclick="searchStudents()">
                                <i class="bi bi-search"></i> Tìm kiếm
                            </button>
                            <button class="btn btn-outline-secondary" type="button" onclick="fetchStudents()">
                                Làm mới
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bảng danh sách sinh viên -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Danh sách Sinh viên</h3>
            </div>
            <div class="card-body">
                <table class="table table-bordered table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Mã SV</th>
                            <th>Họ và tên</th>
                            <th>Email</th>
                            <th>Số điện thoại</th>
                            <th>Lớp</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <!-- Dữ liệu sinh viên sẽ được render vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="student.js"></script>
</body>
</html>
